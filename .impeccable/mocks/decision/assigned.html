<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Day Chart sketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap" rel="stylesheet">
<style>
:root{--g:#0F2B26;--g2:#173B34;--line:#2C5249;--ink:#E8EFE6;--mute:#93AFA4;--f:#FF6319;--warn:#F2B632}
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:800px;overflow:hidden;background:var(--g);color:var(--ink);font-family:Archivo,Arial,sans-serif;font-variant-numeric:tabular-nums}
.top{position:absolute;left:40px;right:40px;top:30px;display:flex;justify-content:space-between;align-items:flex-end}
.clock{position:absolute;right:40px;top:22px;font-size:20px;color:var(--mute)}
h1{font-size:78px;line-height:.98;font-weight:700;letter-spacing:-.018em;font-stretch:85%}
.sub{font-size:27px;color:var(--mute);margin-top:12px}
.sub b{color:var(--ink);font-weight:600}
.leave{text-align:right;padding-top:30px}
.leave .t{font-size:112px;line-height:.9;font-weight:700;letter-spacing:-.03em;font-stretch:85%}
.leave .s{font-size:27px;color:var(--mute);margin-top:12px;display:flex;gap:9px;justify-content:flex-end;align-items:center}
.bul{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--f);color:#111;font-size:19px;font-weight:700}
svg{position:absolute;left:0;top:212px;width:1280px;height:400px}
svg text{font-family:Archivo,Arial,sans-serif;fill:var(--mute);font-size:17px}
.strip{position:absolute;left:40px;right:40px;bottom:26px;display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:56px}
.strip h2{font-size:17px;font-weight:600;color:var(--mute);margin-bottom:9px}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:23px;line-height:1.42}
.row span:last-child{color:var(--mute)}
.mins{display:flex;gap:24px;font-size:30px;font-weight:600;align-items:center}
.mins i{font-style:normal;color:var(--mute);font-weight:400;font-size:19px}
.warn{color:var(--warn)!important}
</style>
</head>

</body>
</html>
