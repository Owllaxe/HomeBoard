<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Next Decision Sign sketch</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:800px;overflow:hidden;background:#111;color:#fff;font-family:"Hanken Grotesk",Arial,sans-serif;font-variant-numeric:tabular-nums}
.sign{background:#FFD400;color:#111;height:470px;padding:34px 48px;display:flex;flex-direction:column;justify-content:space-between}
.sign .top{display:flex;justify-content:space-between;font-size:26px;font-weight:600}
.sign h1{font-size:84px;line-height:1;font-weight:800;letter-spacing:-.02em}
.sign .where{font-size:32px;font-weight:600;margin-top:10px}
.go{display:flex;align-items:flex-end;justify-content:space-between}
.go .t{font-size:150px;line-height:.82;font-weight:800;letter-spacing:-.03em}
.go .r{display:flex;align-items:center;gap:16px;font-size:34px;font-weight:600}
.sq{width:64px;height:64px;background:#111;color:#FFD400;display:grid;place-items:center;font-size:42px;font-weight:800}
.rest{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:48px;padding:34px 48px}
.rest h2{font-size:19px;color:#A5A5A5;font-weight:600;margin-bottom:12px}
.rest p{font-size:26px;line-height:1.5;display:flex;justify-content:space-between}
.rest p span{color:#A5A5A5}
</style>
</head>
<body>
<div class="sign">
  <div class="top"><span>Next</span><span>Fri Oct 30, 8:41</span></div>
  <div><h1>Mechanics of Materials</h1><div class="where">9:30 at Science Center</div></div>
  <div class="go">
    <div class="t">Leave 8:58</div>
    <div class="r"><span class="sq">F</span><span>9:03 from 2 Av<br>17 min from now</span></div>
  </div>
</div>
<div class="rest">
  <section><h2>Later today</h2><p>Calculus III <span>11:00</span></p><p>Fluids lab <span>1:00</span></p></section>
  <section><h2>Due</h2><p>Statics HW 7 <span>Sun</span></p><p>Lab report <span>Mon</span></p></section>
  <section><h2>To do</h2><p>Email Prof. Rao</p><p>Pay Con Ed bill</p></section>
</div>
</body>
</html>
