<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today Is a Line sketch</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:800px;overflow:hidden;background:#fff;color:#111;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.band{height:14px;background:#111}
.head{display:flex;justify-content:space-between;align-items:baseline;padding:22px 44px 0;font-size:26px;font-weight:700}
.head span:last-child{font-weight:400;color:#555}
svg{position:absolute;left:0;top:96px;width:1280px;height:420px}
svg text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#111}
.foot{position:absolute;left:44px;right:44px;bottom:38px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:48px}
.foot h2{font-size:18px;font-weight:700;margin-bottom:8px;border-top:3px solid #111;padding-top:9px}
.foot p{font-size:24px;line-height:1.4}
.foot p span{color:#666}
</style>
</head>
<body>
<div class="band"></div>
<div class="head"><span>Friday</span><span>8:41 am</span></div>
<svg viewBox="0 0 1280 420" aria-label="Today as a subway line">
  <line x1="44" y1="210" x2="1236" y2="210" stroke="#FF6319" stroke-width="16"/>
  <line x1="44" y1="210" x2="150" y2="210" stroke="#BDBDBD" stroke-width="16"/>
  <circle cx="150" cy="210" r="17" fill="#111"/>
  <text x="150" y="264" text-anchor="middle" font-size="24" font-weight="700">You</text>
  <text x="150" y="294" text-anchor="middle" font-size="20" fill="#555">Home</text>

  <circle cx="400" cy="210" r="36" fill="#fff" stroke="#111" stroke-width="9"/>
  <text x="400" y="104" text-anchor="middle" font-size="58" font-weight="700">Mechanics</text>
  <text x="400" y="146" text-anchor="middle" font-size="30">9:30 · Science Center</text>
  <text x="400" y="290" text-anchor="middle" font-size="64" font-weight="700">Leave 8:58</text>
  <text x="400" y="330" text-anchor="middle" font-size="28">in 17 min · F at 9:03</text>

  <circle cx="680" cy="210" r="20" fill="#fff" stroke="#111" stroke-width="6"/>
  <text x="680" y="160" text-anchor="middle" font-size="26" font-weight="700">Calculus III</text>
  <text x="680" y="268" text-anchor="middle" font-size="22">11:00</text>

  <circle cx="900" cy="210" r="20" fill="#fff" stroke="#111" stroke-width="6"/>
  <text x="900" y="160" text-anchor="middle" font-size="26" font-weight="700">Fluids lab</text>
  <text x="900" y="268" text-anchor="middle" font-size="22">1:00</text>

  <circle cx="1140" cy="210" r="20" fill="#fff" stroke="#111" stroke-width="6"/>
  <text x="1140" y="160" text-anchor="middle" font-size="26" font-weight="700">Home</text>
  <text x="1140" y="268" text-anchor="middle" font-size="22">about 4:30</text>
</svg>
<div class="foot">
  <section><h2>F at 2 Av, to Brooklyn</h2><p>5, 12, 22 <span>min</span></p></section>
  <section><h2>Due</h2><p>Statics HW 7 <span>Sun 11:59 pm</span></p></section>
  <section><h2>To do</h2><p>Email Prof. Rao <span>today</span></p></section>
</div>
</body>
</html>
